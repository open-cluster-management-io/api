version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 14
    groups:
      k8s-io:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/*
        update-types:
          - major
          - minor
      gomod:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ":seedling:"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
